name: iOS Build (Lumina Pro)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Initialize Project Scaffolding
        run: |
          flutter create --platforms=ios --org com.luminapro --project-name lumina_pro .
          flutter create --template=plugin_ffi --platforms=ios dsp_plugin
          rm -f dsp_plugin/ios/Classes/dsp_plugin.c
          mkdir -p dsp_plugin/ios/Classes/dsp
          cp ios/Classes/dsp/* dsp_plugin/ios/Classes/
          
          cat <<EOF > pubspec.yaml
          name: lumina_pro
          description: "Bit-Perfect Audio Player"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            ffi: ^2.1.0
            path_provider: ^2.1.2
            just_audio: ^0.9.36
            audio_session: ^0.1.18
            path: ^1.9.0
            metadata_god: ^0.5.0
            dsp_plugin:
              path: ./dsp_plugin
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^2.0.0
          flutter:
            uses-material-design: true
          EOF
          
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppleMusicUsageDescription string 'Lumina Pro needs access to your music library.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Lumina Pro needs access to display album art.'" ios/Runner/Info.plist

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (Debug Simulator ARM64)
        run: |
          flutter build ios --debug --simulator

      - name: Create Payload and IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios/iphonesimulator -name "*.app" | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r app.ipa Payload
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-pro-ipa
          path: app.ipa