name: iOS Build (Lumina Pro)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # Use a stable version
          channel: 'stable'

      - name: Initialize Project Scaffolding
        run: |
          # Create the base Flutter app (won't overwrite our custom lib/ or pubspec.yaml if done carefully)
          flutter create --platforms=ios --org com.luminapro --project-name lumina_pro .
          
          # Create a local FFI plugin to handle C++ compilation without modifying Xcode project manually
          flutter create --template=plugin_ffi --platforms=ios dsp_plugin
          
          # Move our custom DSP C++ files into the plugin's iOS classes folder
          rm -f dsp_plugin/ios/Classes/dsp_plugin.c
          mkdir -p dsp_plugin/ios/Classes/dsp
          cp ios/Classes/dsp/* dsp_plugin/ios/Classes/
          
          # Inject the plugin dependency into pubspec.yaml
          echo "  dsp_plugin:" >> pubspec.yaml
          echo "    path: ./dsp_plugin" >> pubspec.yaml
          
          # Overwrite Info.plist with our custom one (File Sharing enabled)
          cp ios/Runner/Info.plist ios/Runner/Info.plist.bak || true
          # Note: flutter create generated a new Info.plist. We append our keys using PlistBuddy.
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" ios/Runner/Info.plist

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (No Sign)
        run: flutter build ios --release --no-codesign

      - name: Create Payload and IPA
        run: |
          mkdir -p Payload
          # The built app is in build/ios/iphoneos/Runner.app
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r app.ipa Payload
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-pro-ipa
          path: app.ipa