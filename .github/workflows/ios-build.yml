name: iOS Build (Lumina Pro)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Initialize Project Scaffolding
        run: |
          # Create the base Flutter app
          flutter create --platforms=ios --org com.luminapro --project-name lumina_pro .
          
          # Create a local FFI plugin
          flutter create --template=plugin_ffi --platforms=ios dsp_plugin
          
          # Move custom DSP C++ files
          rm -f dsp_plugin/ios/Classes/dsp_plugin.c
          mkdir -p dsp_plugin/ios/Classes/dsp
          cp ios/Classes/dsp/* dsp_plugin/ios/Classes/
          
          # Overwrite pubspec.yaml
          cat <<EOF > pubspec.yaml
          name: lumina_pro
          description: "Bit-Perfect Audio Player"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            ffi: ^2.1.0
            dsp_plugin:
              path: ./dsp_plugin
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^2.0.0
          flutter:
            uses-material-design: true
          EOF
          
          # Overwrite Info.plist keys
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" ios/Runner/Info.plist
          
          # Ultra-aggressive Xcode project patching to kill signing
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DevelopmentTeam = [A-Z0-9]*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = ".*";//g' ios/Runner.xcodeproj/project.pbxproj

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (No Sign)
        run: |
          flutter build ios --release --no-codesign \
            --extra-gen-snapshot-options=--no-codesign \
            --extra-front-end-options=--no-codesign
        env:
          # Force Xcode to ignore signing at the environment level
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""

      - name: Create Payload and IPA
        run: |
          mkdir -p Payload
          # In some flutter versions, the output might be in Release-iphoneos
          APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "App not found in build/ios/iphoneos, searching in Release-iphoneos"
            APP_PATH=$(find build/ios/Release-iphoneos -name "*.app" | head -n 1)
          fi
          echo "Moving $APP_PATH to Payload"
          cp -R "$APP_PATH" Payload/
          zip -r app.ipa Payload
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-pro-ipa
          path: app.ipa