name: iOS Build (Lumina Pro)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Initialize Project Scaffolding
        run: |
          flutter create --platforms=ios --org com.luminapro --project-name lumina_pro .
          flutter create --template=plugin_ffi --platforms=ios dsp_plugin
          rm -f dsp_plugin/ios/Classes/dsp_plugin.c
          mkdir -p dsp_plugin/ios/Classes/dsp
          cp ios/Classes/dsp/* dsp_plugin/ios/Classes/
          
          cat <<EOF > pubspec.yaml
          name: lumina_pro
          description: "Bit-Perfect Audio Player"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            ffi: ^2.1.0
            dsp_plugin:
              path: ./dsp_plugin
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^2.0.0
          flutter:
            uses-material-design: true
          EOF
          
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" ios/Runner/Info.plist
          
          # Patch Xcode to allow building without a team
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (Release Mode for Device)
        run: |
          # We MUST build for 'ios' (device) in 'release' mode for it to work on a real iPhone.
          # We use --no-codesign and pass flags to Xcode to bypass the Team requirement.
          flutter build ios --release --no-codesign --extra-gen-snapshot-options=--no-codesign
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""

      - name: Create Payload and IPA
        run: |
          mkdir -p Payload
          # Find the Release .app folder
          APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -n 1)
          echo "Found Release App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r app.ipa Payload
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-pro-ipa
          path: app.ipa