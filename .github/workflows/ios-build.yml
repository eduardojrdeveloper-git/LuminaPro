name: iOS Build (Lumina Pro)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Initialize Project Scaffolding
        run: |
          flutter create --platforms=ios --org com.luminapro --project-name lumina_pro .
          flutter create --template=plugin_ffi --platforms=ios dsp_plugin
          rm -f dsp_plugin/ios/Classes/dsp_plugin.c
          mkdir -p dsp_plugin/ios/Classes/dsp
          cp ios/Classes/dsp/* dsp_plugin/ios/Classes/ || true
          
          cat << 'SWIFT_EOF' > ios/Runner/AppDelegate.swift
          import UIKit
          import Flutter
          import AVFoundation

          @main
          @objc class AppDelegate: FlutterAppDelegate {
              var engine = AVAudioEngine()
              var playerNode = AVAudioPlayerNode()
              var eqNode = AVAudioUnitEQ(numberOfBands: 10)
              var positionChannel: FlutterEventChannel?
              var stateChannel: FlutterEventChannel?
              var positionSink: FlutterEventSink?
              var stateSink: FlutterEventSink?
              
              var currentTimer: Timer?
              var audioFile: AVAudioFile?
              
              override func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {
                  let controller = window?.rootViewController as! FlutterViewController
                  
                  let methodChannel = FlutterMethodChannel(name: "com.luminapro/audio", binaryMessenger: controller.binaryMessenger)
                  positionChannel = FlutterEventChannel(name: "com.luminapro/audio_position", binaryMessenger: controller.binaryMessenger)
                  stateChannel = FlutterEventChannel(name: "com.luminapro/audio_state", binaryMessenger: controller.binaryMessenger)
                  
                  positionChannel?.setStreamHandler(PositionStreamHandler(appDelegate: self))
                  stateChannel?.setStreamHandler(StateStreamHandler(appDelegate: self))
                  
                  setupAudioEngine()
                  
                  methodChannel.setMethodCallHandler({ [weak self] (call: FlutterMethodCall, result: @escaping FlutterResult) -> Void in
                      guard let self = self else { return }
                      switch call.method {
                      case "play":
                          if let args = call.arguments as? [String: Any], let path = args["path"] as? String {
                              self.playAudio(path: path)
                              result(nil)
                          } else { result(FlutterError(code: "INVALID_ARGS", message: nil, details: nil)) }
                      case "pause":
                          self.pauseAudio()
                          result(nil)
                      case "resume":
                          self.resumeAudio()
                          result(nil)
                      case "seek":
                          if let args = call.arguments as? [String: Any], let pos = args["position"] as? Int {
                              self.seekAudio(toMs: pos)
                              result(nil)
                          } else { result(FlutterError(code: "INVALID_ARGS", message: nil, details: nil)) }
                      case "updateEQ":
                          if let args = call.arguments as? [String: Any], let bands = args["bands"] as? [[String: Any]] {
                              self.updateEQ(bands: bands)
                              result(nil)
                          } else { result(FlutterError(code: "INVALID_ARGS", message: nil, details: nil)) }
                      default:
                          result(FlutterMethodNotImplemented)
                      }
                  })
                  
                  GeneratedPluginRegistrant.register(with: self)
                  return super.application(application, didFinishLaunchingWithOptions: launchOptions)
              }
              
              func setupAudioEngine() {
                  engine.attach(playerNode)
                  engine.attach(eqNode)
                  
                  for i in 0..<eqNode.bands.count {
                      eqNode.bands[i].filterType = .parametric
                      eqNode.bands[i].bypass = false
                      eqNode.bands[i].frequency = 1000.0
                      eqNode.bands[i].gain = 0.0
                  }
                  
                  engine.connect(playerNode, to: eqNode, format: nil)
                  engine.connect(eqNode, to: engine.mainMixerNode, format: nil)
                  
                  do {
                      try AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, policy: .longFormAudio)
                      try AVAudioSession.sharedInstance().setActive(true)
                      try engine.start()
                  } catch {
                      print("Audio Engine setup error: \(error)")
                  }
              }
              
              func playAudio(path: String) {
                  let url = URL(fileURLWithPath: path)
                  do {
                      audioFile = try AVAudioFile(forReading: url)
                      playerNode.stop()
                      playerNode.scheduleFile(audioFile!, at: nil) {
                          DispatchQueue.main.async {
                              self.stateSink?(["finished": true])
                          }
                      }
                      playerNode.play()
                      
                      let duration = Double(audioFile!.length) / audioFile!.processingFormat.sampleRate
                      positionSink?(["duration": Int(duration * 1000)])
                      stateSink?(["playing": true])
                      
                      startTimer()
                  } catch {
                      print("Error playing file: \(error)")
                  }
              }
              
              func pauseAudio() {
                  playerNode.pause()
                  stopTimer()
                  stateSink?(["playing": false])
              }
              
              func resumeAudio() {
                  guard !playerNode.isPlaying else { return }
                  playerNode.play()
                  startTimer()
                  stateSink?(["playing": true])
              }
              
              func seekAudio(toMs: Int) {
                  guard let audioFile = audioFile else { return }
                  let sampleRate = audioFile.processingFormat.sampleRate
                  let newFramePosition = AVAudioFramePosition(Double(toMs) / 1000.0 * sampleRate)
                  
                  let wasPlaying = playerNode.isPlaying
                  playerNode.stop()
                  
                  let framesToPlay = AVAudioFrameCount(audioFile.length - newFramePosition)
                  if framesToPlay > 0 {
                      playerNode.scheduleSegment(audioFile, startingFrame: newFramePosition, frameCount: framesToPlay, at: nil) {
                          DispatchQueue.main.async {
                              self.stateSink?(["finished": true])
                          }
                      }
                  }
                  
                  if wasPlaying {
                      playerNode.play()
                  }
                  positionSink?(["position": toMs])
              }
              
              func updateEQ(bands: [[String: Any]]) {
                  for (i, b) in bands.enumerated() {
                      if i < eqNode.bands.count {
                          if let fc = b["fc"] as? Double { eqNode.bands[i].frequency = Float(fc) }
                          if let gain = b["gain"] as? Double { eqNode.bands[i].gain = Float(gain) }
                          if let q = b["q"] as? Double { eqNode.bands[i].bandwidth = Float(q) }
                      }
                  }
              }
              
              func startTimer() {
                  currentTimer?.invalidate()
                  currentTimer = Timer.scheduledTimer(withTimeInterval: 0.2, repeats: true) { [weak self] _ in
                      guard let self = self, let nodeTime = self.playerNode.lastRenderTime, let playerTime = self.playerNode.playerTime(forNodeTime: nodeTime) else { return }
                      let posMs = Int((Double(playerTime.sampleTime) / playerTime.sampleRate) * 1000)
                      self.positionSink?(["position": posMs])
                  }
              }
              
              func stopTimer() {
                  currentTimer?.invalidate()
                  currentTimer = nil
              }
          }

          class PositionStreamHandler: NSObject, FlutterStreamHandler {
              weak var appDelegate: AppDelegate?
              init(appDelegate: AppDelegate) { self.appDelegate = appDelegate }
              func onListen(withArguments arguments: Any?, eventSink events: @escaping FlutterEventSink) -> FlutterError? {
                  appDelegate?.positionSink = events
                  return nil
              }
              func onCancel(withArguments arguments: Any?) -> FlutterError? {
                  appDelegate?.positionSink = nil
                  return nil
              }
          }

          class StateStreamHandler: NSObject, FlutterStreamHandler {
              weak var appDelegate: AppDelegate?
              init(appDelegate: AppDelegate) { self.appDelegate = appDelegate }
              func onListen(withArguments arguments: Any?, eventSink events: @escaping FlutterEventSink) -> FlutterError? {
                  appDelegate?.stateSink = events
                  return nil
              }
              func onCancel(withArguments arguments: Any?) -> FlutterError? {
                  appDelegate?.stateSink = nil
                  return nil
              }
          }
          SWIFT_EOF
          
          cat <<EOF > pubspec.yaml
          name: lumina_pro
          description: "Bit-Perfect Audio Player"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            ffi: ^2.1.0
            path_provider: ^2.1.2
            path: ^1.9.0
            metadata_god: ^0.5.0
            dsp_plugin:
              path: ./dsp_plugin
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^2.0.0
          flutter:
            uses-material-design: true
          EOF
          
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppleMusicUsageDescription string 'Lumina Pro needs access to your music library.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Lumina Pro needs access to display album art.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist || true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          pod install || true
          
          # Inject code-signing bypass inside the existing Flutter post_install block
          awk '/post_install do \|installer\|/{print; print "  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGN_IDENTITY\"] = \"\"\n      config.build_settings[\"EXPANDED_CODE_SIGN_IDENTITY\"] = \"\"\n    end\n  end"; next}1' Podfile > Podfile.tmp && mv Podfile.tmp Podfile
          
          pod install

      - name: Disable Code Signing in Runner
        run: |
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = ""/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build iOS App (Unsigned for Device)
        run: |
          cd ios
          xcodebuild build -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true
          cd ..
          flutter build ios --release --no-codesign

      - name: Create Payload and IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r app.ipa Payload
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-pro-ipa
          path: app.ipa