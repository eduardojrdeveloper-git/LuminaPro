name: iOS Build (Lumina Pro)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Initialize Project Scaffolding
        run: |
          # Create the base Flutter app
          flutter create --platforms=ios --org com.luminapro --project-name lumina_pro .
          
          # Create a local FFI plugin
          flutter create --template=plugin_ffi --platforms=ios dsp_plugin
          
          # Move custom DSP C++ files
          rm -f dsp_plugin/ios/Classes/dsp_plugin.c
          mkdir -p dsp_plugin/ios/Classes/dsp
          cp ios/Classes/dsp/* dsp_plugin/ios/Classes/
          
          # Inject the plugin dependency into pubspec.yaml
          # Using a simpler sed command to avoid YAML multi-line issues
          sed -i '' '/dependencies:/a \
            \  dsp_plugin: \
            \    path: ./dsp_plugin' pubspec.yaml
          
          # Overwrite Info.plist keys
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" ios/Runner/Info.plist

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (No Sign)
        run: flutter build ios --release --no-codesign

      - name: Create Payload and IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r app.ipa Payload
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-pro-ipa
          path: app.ipa