name: iOS Build (Lumina Pro)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build Go Backend
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          cd go_backend
          gomobile bind -target=ios -o ../Gobackend.xcframework .
          cd ..

      - name: Initialize Project Scaffolding
        run: |
          flutter create --platforms=ios --org com.luminapro --project-name lumina_pro .
          flutter create --template=plugin_ffi --platforms=ios dsp_plugin
          rm -f dsp_plugin/ios/Classes/dsp_plugin.c
          mkdir -p dsp_plugin/ios/Classes/dsp
          cp ios/Classes/dsp/* dsp_plugin/ios/Classes/ || true
          
          # Move the compiled Go framework into the plugin and link it
          mv Gobackend.xcframework dsp_plugin/ios/
          sed -i '' '/s.source_files/a \
            s.vendored_frameworks = "Gobackend.xcframework"\
          ' dsp_plugin/ios/dsp_plugin.podspec

          
          cp ios_template/AppDelegate.swift ios/Runner/AppDelegate.swift
          
          cat <<EOF > pubspec.yaml
          name: lumina_pro
          description: "Bit-Perfect Audio Player"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            ffi: ^2.1.0
            path_provider: ^2.1.2
            path: ^1.9.0
            metadata_god: ^0.5.0
            google_fonts: ^6.2.1
            share_plus: ^9.0.0
            cupertino_icons: ^1.0.8
            shared_preferences: ^2.2.2
            file_picker: ^8.0.0
            google_sign_in: ^6.2.1
            googleapis: ^13.1.0
            googleapis_auth: ^1.6.0
            http: ^1.2.0
            wakelock_plus: 1.2.8
            fftea: ^1.5.0+1
            scrollable_positioned_list: ^0.3.8
            ffmpeg_kit_flutter:
              git:
                url: https://github.com/Sahad2701/ffmpeg-kit.git
                path: flutter/flutter
                ref: flutter_fix_retired_v6.0.3
            dsp_plugin:
              path: ./dsp_plugin
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^2.0.0
          flutter:
            uses-material-design: true
          EOF
          
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppleMusicUsageDescription string 'Lumina Pro needs access to your music library.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Lumina Pro needs access to display album art.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist || true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          # Set platform to 13.0 for FFmpeg Kit compatibility
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/g" Podfile || true
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/g" Podfile || true
          sed -i '' "s/platform :ios, '11.0'/platform :ios, '13.0'/g" Podfile || true
          
          pod install || true
          
          # Inject code-signing bypass inside the existing Flutter post_install block
          awk '/post_install do \|installer\|/{print; print "  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGN_IDENTITY\"] = \"\"\n      config.build_settings[\"EXPANDED_CODE_SIGN_IDENTITY\"] = \"\"\n    end\n  end"; next}1' Podfile > Podfile.tmp && mv Podfile.tmp Podfile
          
          pod install

      - name: Disable Code Signing in Runner
        run: |
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = ""/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build iOS App (Unsigned for Device)
        run: |
          cd ios
          xcodebuild build -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true
          cd ..
          flutter build ios --release --no-codesign

      - name: Create Payload and IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r app.ipa Payload
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-pro-ipa
          path: app.ipa